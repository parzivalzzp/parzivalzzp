<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90">
  <rect x="300" y="10" rx="25" ry="25" width="200" height="50" fill="#000">
    <animate attributeName="width" values="200;380;200" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="300;210;300" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="330" cy="35" r="6" fill="#30d158">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="40" fill="#fff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Available for work
  </text>
</svg>
