<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <!-- desktop background -->
  <rect width="800" height="120" fill="#1e1e2e"/>

  <!-- notch menempel di tepi atas -->
  <path d="M220 0 Q240 0 240 20 V42 Q240 62 260 62 H540 Q560 62 560 42 V20 Q560 0 580 0 Z" fill="#11111b"/>

  <!-- workspace dots -->
  <circle cx="285" cy="31" r="5" fill="#cba6f7"/>
  <circle cx="305" cy="31" r="4" fill="#585b70"/>
  <circle cx="323" cy="31" r="4" fill="#585b70"/>

  <!-- teks tengah -->
  <text x="400" y="36" fill="#cdd6f4" font-family="monospace" font-size="13" text-anchor="middle">
    yourname@arch ~ <tspan fill="#a6e3a1">●</tspan> online
  </text>

  <!-- jam & baterai -->
  <text x="500" y="36" fill="#89b4fa" font-family="monospace" font-size="12">23:42</text>
  <rect x="535" y="25" width="16" height="10" rx="2" fill="none" stroke="#a6e3a1"/>
  <rect x="537" y="27" width="10" height="6" rx="1" fill="#a6e3a1"/>

  <!-- hover effect: notch melebar -->
  <path d="M220 0 Q240 0 240 20 V42 Q240 62 260 62 H540 Q560 62 560 42 V20 Q560 0 580 0 Z" fill="none" stroke="#cba6f7" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
